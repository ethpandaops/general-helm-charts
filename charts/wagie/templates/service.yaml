{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wagie.fullname" . }}
  labels:
    {{- include "wagie.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ include "wagie.httpPort" . }}
      targetPort: http
      protocol: TCP
    {{- with .Values.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "wagie.selectorLabels" . | nindent 4 }}
{{- end }}
